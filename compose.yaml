services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: games_bot
      POSTGRES_USER: games_bot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-games_bot_local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U games_bot -d games_bot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
